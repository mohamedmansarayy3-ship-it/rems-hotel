<script>
/* ================= LOAD BOOKING DATA ================= */
const stored = sessionStorage.getItem("bookingData");
if (!stored) {
  alert("Booking session expired. Please book again.");
  location.href = "booking.html";
  throw new Error("No bookingData");
}
const data = JSON.parse(stored);

/* ================= ELEMENTS ================= */
const method = document.getElementById("method");
const bank = document.getElementById("bank");
const afri = document.getElementById("afri");
const orange = document.getElementById("orange");
const qmoney = document.getElementById("qmoney");

const bankReceipt = document.getElementById("bankReceipt");
const afriTxn = document.getElementById("afriTxn");
const orangeTxn = document.getElementById("orangeTxn");
const qmoneyTxn = document.getElementById("qmoneyTxn");

const status = document.getElementById("status");
const payBtn = document.getElementById("payBtn");

/* ================= SWITCH PAYMENT UI ================= */
method.addEventListener("change", () => {
  bank.classList.add("hidden");
  afri.classList.add("hidden");
  orange.classList.add("hidden");
  qmoney.classList.add("hidden");

  if (method.value === "bank") bank.classList.remove("hidden");
  if (method.value === "afrimoney") afri.classList.remove("hidden");
  if (method.value === "orange") orange.classList.remove("hidden");
  if (method.value === "qmoney") qmoney.classList.remove("hidden");
});

/* ================= PAYMENT SUBMIT ================= */
async function pay() {
  if (!method.value) {
    alert("Select payment method");
    return;
  }

  payBtn.disabled = true;
  payBtn.textContent = "Submitting...";
  status.textContent = "";

  let transactionId = null;

  if (method.value === "afrimoney") {
    if (!afriTxn.value.trim()) return fail("Enter Afrimoney Transaction ID");
    transactionId = afriTxn.value.trim();
  }

  if (method.value === "orange") {
    if (!orangeTxn.value.trim()) return fail("Enter Orange Money Transaction ID");
    transactionId = orangeTxn.value.trim();
  }

  if (method.value === "qmoney") {
    if (!qmoneyTxn.value.trim()) return fail("Enter QMoney Transaction ID");
    transactionId = qmoneyTxn.value.trim();
  }

  try {
    const response = await fetch(
      "https://macbookair.remshotelgroupsix.workers.dev/api/booking",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: data.name,
          email: data.email,
          phone: data.phone,
          room: data.room,
          roomNumber: data.number,
          checkin: data.checkin,
          checkout: data.checkout,
          totalAmount: data.totalAmount,
          paymentMethod: method.value,
          transactionId
        })
      }
    );

    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "Server error");
    }

    const result = await response.json();

    status.textContent = "✅ Payment submitted successfully";
    status.className = "success";
    payBtn.textContent = "Submitted";

    sessionStorage.removeItem("bookingData");

  } catch (err) {
    console.error(err);
    fail("Payment failed: Network or server error");
  }
}

/* ================= HELPERS ================= */
function fail(msg) {
  alert(msg);
  status.textContent = "❌ " + msg;
  payBtn.disabled = false;
  payBtn.textContent = "Confirm & Send Payment";
}
</script>
