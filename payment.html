<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | REMS HOTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#f4f6f8; padding:20px }
.container { max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:8px }
button, select, input { width:100%; padding:10px; margin-top:10px }
.success { color:green }
.error { color:red }
</style>
</head>

<body>
<div class="container">
  <h2>Confirm Payment</h2>

  <select id="method">
    <option value="">Select payment method</option>
    <option value="bank">Bank</option>
    <option value="afrimoney">Afrimoney</option>
    <option value="orange">Orange Money</option>
    <option value="qmoney">QMoney</option>
  </select>

  <input id="txn" placeholder="Transaction ID" />

  <button id="payBtn">Send Payment</button>

  <p id="status"></p>
</div>

<script>
(function () {
  "use strict";

  const status = document.getElementById("status");
  const methodEl = document.getElementById("method");
  const txnEl = document.getElementById("txn");
  const payBtn = document.getElementById("payBtn");

  payBtn.addEventListener("click", pay);

  async function pay() {
    status.textContent = "";
    status.className = "";

    if (!methodEl.value) {
      alert("Select payment method");
      return;
    }

    const stored = sessionStorage.getItem("bookingData");
    if (!stored) {
      alert("Booking session expired. Please book again.");
      location.href = "booking.html";
      return;
    }

    const booking = JSON.parse(stored);
    const transactionId = txnEl.value.trim() || null;

    payBtn.disabled = true;
    payBtn.textContent = "Submitting...";

    try {
      const response = await fetch(
        "https://macbookair.remshotelgroupsix.workers.dev/api/booking",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            room: booking.room,
            number: booking.number,
            duration: booking.duration,
            totalAmount: booking.totalAmount,
            paymentMethod: methodEl.value,
            transactionId
          })
        }
      );

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || "Server error");
      }

      await response.json();

      status.textContent = "✅ Payment submitted successfully";
      status.className = "success";
      payBtn.textContent = "Submitted";

      sessionStorage.removeItem("bookingData");

    } catch (err) {
      console.error(err);
      status.textContent = "❌ Payment failed";
      status.className = "error";
      payBtn.disabled = false;
      payBtn.textContent = "Send Payment";
      alert("Payment failed: " + err.message);
    }
  }
})();
</script>
</body>
</html>
