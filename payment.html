<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | REMS HOTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:8px}
button,select,input{width:100%;padding:10px;margin-top:10px}
.success{color:green}
.error{color:red}
</style>
</head>

<body>
<div class="container">
  <h2>Confirm Payment</h2>

  <select id="method">
    <option value="">Select payment method</option>
    <option value="bank">Bank</option>
    <option value="afrimoney">Afrimoney</option>
    <option value="orange">Orange Money</option>
    <option value="qmoney">QMoney</option>
  </select>

  <input id="txn" placeholder="Transaction ID (if any)" />

  <button onclick="pay()">Send Payment</button>

  <p id="status"></p>
</div>

<script>
async function pay() {
  const status = document.getElementById("status");
  const method = document.getElementById("method").value;
  const txn = document.getElementById("txn").value.trim();

  if (!method) {
    alert("Select payment method");
    return;
  }

  const stored = sessionStorage.getItem("bookingData");
  if (!stored) {
    alert("Booking expired");
    return;
  }

  const data = JSON.parse(stored);

  status.textContent = "Submitting payment...";

  try {
    const res = await fetch(
      "https://macbookair.remshotelgroupsix.workers.dev/api/booking",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: data.name,
          email: data.email,
          phone: data.phone,
          room: data.room,
          roomNumber: data.number,
          checkin: data.checkin,
          checkout: data.checkout,
          totalAmount: data.totalAmount,
          paymentMethod: method,
          transactionId: txn || null
        })
      }
    );

    const result = await res.json();

    if (!res.ok || !result.success) {
      throw new Error("Server rejected request");
    }

    status.textContent = "✅ Payment successful";
    status.className = "success";

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Payment failed";
    status.className = "error";
  }
}
</script>
</body>
</html>
