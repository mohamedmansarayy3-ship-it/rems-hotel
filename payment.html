<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | REMS HOTEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:25px;border-radius:10px}
label{font-weight:bold;display:block;margin-top:10px}
input,button{width:100%;padding:10px;margin-top:8px}
button{background:#0a7cff;color:#fff;border:none;cursor:pointer}
button:hover{opacity:0.9}
#status{margin-top:15px;font-weight:bold;text-align:center}
</style>
</head>

<body>

<div class="container">
<h2>Hotel Booking Payment</h2>

<form id="paymentForm">
  <label>Full Name</label>
  <input type="text" id="name" required>

  <label>Email</label>
  <input type="email" id="email" required>

  <label>Room Type</label>
  <input type="text" id="room_type" required>

  <label>Check-in</label>
  <input type="date" id="check_in" required>

  <label>Check-out</label>
  <input type="date" id="check_out" required>

  <button type="submit">Confirm Payment</button>
</form>

<p id="status"></p>
</div>

<script>
const form = document.getElementById("paymentForm");
const statusText = document.getElementById("status");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  statusText.textContent = "Processing payment...";
  statusText.style.color = "black";

  const payload = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    room_type: document.getElementById("room_type").value.trim(),
    check_in: document.getElementById("check_in").value,
    check_out: document.getElementById("check_out").value
  };

  try {
    const res = await fetch(
      "https://macbookair.remshotelgroupsix.workers.dev/api/booking",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }
    );

    if (!res.ok) {
      throw new Error("Server error");
    }

    await res.json();

    statusText.textContent = "Payment submitted successfully!";
    statusText.style.color = "green";
    form.reset();

  } catch (err) {
    console.error(err);
    statusText.textContent = "Payment failed. Please try again.";
    statusText.style.color = "red";
  }
});
</script>

</body>
</html>
